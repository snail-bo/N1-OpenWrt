name: Build iStoreOS bypass routers

on:
  push:
    branches: [master]
    paths:
      - ".github/**"
      - "build/**"
      - "platforms/**"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "0 0 1,16 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/istoreos/istoreos.git
  SOURCE_BRANCH: istoreos-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64, n1, hc5962]

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          mapfile -t packages < .github/build-packages.txt
          sudo apt-get -qq install -y --no-install-recommends "${packages[@]}"
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Clone iStoreOS
        working-directory: /workdir
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          echo "SOURCE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: istoreos-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('build/**', 'platforms/**') }}
          restore-keys: |
            istoreos-${{ runner.os }}-${{ matrix.platform }}-

      - name: Prepare feeds and platform packages
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          bash "$GITHUB_WORKSPACE/build/prepare-packages.sh" "${{ matrix.platform }}"
          ./scripts/feeds install -a

      - name: Load and verify configuration
        run: |
          set -euo pipefail
          cd openwrt
          cp "$GITHUB_WORKSPACE/platforms/${{ matrix.platform }}/config.seed" .config
          rm -rf files
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/platforms/common/files/." files/
          cp -a "$GITHUB_WORKSPACE/platforms/${{ matrix.platform }}/files/." files/
          if [ '${{ matrix.platform }}' = x86_64 ]; then
            grep -q "option ipaddr '192.168.9.150'" files/etc/config/network
          else
            grep -q "option ipaddr '192.168.3.1'" files/etc/config/network
          fi
          make defconfig
          grep -qx 'CONFIG_PACKAGE_luci-theme-argon=y' .config
          ! grep -Eq '^CONFIG_PACKAGE_(luci-app-samba4|samba4-server|luci-app-ksmbd|ksmbd-server|luci-app-dockerman|dockerd|podman)=y$' .config
          ! grep -Eq '^CONFIG_PACKAGE_(wpad|wpad-basic-mbedtls|wpad-basic-wolfssl|hostapd|kmod-mac80211|kmod-cfg80211)=y$' .config
          if [ '${{ matrix.platform }}' = x86_64 ]; then
            grep -A2 "config interface 'wan'" files/etc/config/network | grep -q "option proto 'dhcp'"
            grep -A2 "config interface 'lan'" files/etc/config/network | grep -q "option device 'eth0'"
            grep -A2 "config interface 'wan'" files/etc/config/network | grep -q "option device 'eth1'"
            grep -qx 'GO_VERSION_MAJOR_MINOR:=1.26' feeds/packages/lang/golang/golang/Makefile
            grep -qx 'CONFIG_TARGET_x86_64=y' .config
            grep -qx 'CONFIG_PACKAGE_daed=y' .config
            grep -qx 'CONFIG_PACKAGE_luci-app-daede=y' .config
            grep -qx 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config
            grep -qx 'CONFIG_KERNEL_TCP_CONG_BBR=y' .config
          elif [ '${{ matrix.platform }}' = n1 ]; then
            grep -qx 'GO_VERSION_MAJOR_MINOR:=1.26' feeds/packages/lang/golang/golang/Makefile
            grep -qx 'CONFIG_TARGET_armsr_armv8=y' .config
            grep -qx 'CONFIG_PACKAGE_luci-app-amlogic=y' .config
            grep -qx 'CONFIG_PACKAGE_daed=y' .config
            grep -qx 'CONFIG_PACKAGE_luci-app-daede=y' .config
            grep -qx 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config
          else
            grep -A2 "config interface 'wan'" files/etc/config/network | grep -q "option proto 'dhcp'"
            grep -qx 'GO_VERSION_MAJOR_MINOR:=1.25' feeds/packages/lang/golang/golang/Makefile
            grep -qx 'CONFIG_TARGET_ramips_mt7621_DEVICE_hiwifi_hc5962=y' .config
            grep -qx 'CONFIG_PACKAGE_luci-app-passwall=y' .config
            grep -qx 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y' .config
            grep -qx 'CONFIG_PACKAGE_sing-box=y' .config
            grep -qx 'CONFIG_PACKAGE_dnsmasq-full=y' .config
            ! grep -qx 'CONFIG_PACKAGE_dnsmasq=y' .config
            grep -qx 'CONFIG_KERNEL_TCP_CONG_BBR=y' .config
            ! grep -Eq '^CONFIG_PACKAGE_(daed|luci-app-daede|xray-core|kmod-mt7603|kmod-mt76x2|kmod-mt76)=y$' .config
          fi

      - name: Download sources
        working-directory: ./openwrt
        timeout-minutes: 60
        run: |
          set -euo pipefail
          jobs=$(nproc)
          [ "$jobs" -le 4 ] || jobs=4
          if ! make download -j"$jobs"; then
            find dl -size -1k -delete
            make download -j1 V=s
          fi
          find dl -size -1k -delete

      - name: Compile firmware
        working-directory: ./openwrt
        timeout-minutes: 270
        run: |
          set -o pipefail
          jobs=$(( $(nproc) + 1 ))
          if ! make -j"$jobs"; then
            make -j1 V=s 2>&1 | tee build-retry.log
          fi

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-${{ matrix.platform }}
          path: openwrt/build-retry.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect x86_64 images
        if: matrix.platform == 'x86_64'
        run: |
          set -euo pipefail
          mkdir -p output
          target=openwrt/bin/targets/x86/64
          cp "$target"/*combined*.img.gz output/
          cp openwrt/.config output/x86_64.config
          cp "$target"/sha256sums output/
          printf 'iStoreOS %s\ndaede %s\nargon %s\n' \
            "$SOURCE_COMMIT" \
            "$(cat openwrt/package/custom/daede/.source-revision)" \
            "$(cat openwrt/package/custom/argon/.source-revision)" > output/source-versions.txt
          ls -lh output

      - name: Package N1 image
        if: matrix.platform == 'n1'
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ophub/kernel
          kernel_usage: flippy
          openwrt_kernel: 6.12.y
          openwrt_size: 256/1024
          builder_name: ${{ github.repository_owner }}

      - name: Collect N1 images
        if: matrix.platform == 'n1'
        run: |
          set -euo pipefail
          mkdir -p output
          cp "${PACKAGED_OUTPUTPATH}"/*.img.gz output/
          cp openwrt/.config output/n1.config
          printf 'iStoreOS %s\ndaede %s\nargon %s\n' \
            "$SOURCE_COMMIT" \
            "$(cat openwrt/package/custom/daede/.source-revision)" \
            "$(cat openwrt/package/custom/argon/.source-revision)" > output/source-versions-n1.txt
          cd output
          sha256sum -- * > sha256sums-n1.txt
          ls -lh

      - name: Collect HC5962 images
        if: matrix.platform == 'hc5962'
        run: |
          set -euo pipefail
          mkdir -p output
          target=openwrt/bin/targets/ramips/mt7621
          cp "$target"/*hiwifi_hc5962*.bin output/
          cp openwrt/.config output/hc5962.config
          cp "$target"/sha256sums output/
          printf 'iStoreOS %s\nPassWall %s\nPassWall packages %s\nargon %s\n' \
            "$SOURCE_COMMIT" \
            "$(cat openwrt/package/custom/passwall/.source-revision)" \
            "$(cat openwrt/package/custom/passwall-packages/.source-revision)" \
            "$(cat openwrt/package/custom/argon/.source-revision)" > output/source-versions-hc5962.txt
          ls -lh output

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-${{ matrix.platform }}
          path: output/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish firmware
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: istoreos-*
          path: release
          merge-multiple: true

      - name: Prepare release metadata
        run: echo "FILE_DATE=$(TZ=Asia/Shanghai date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: istoreos-bypass_${{ env.FILE_DATE }}_${{ github.run_number }}
          files: release/*
          body: |
            iStoreOS 24.10 bypass-router builds for x86_64, Phicomm N1 and HiWiFi HC5962.

            x86_64 LAN (eth0): 192.168.9.150
            x86_64 WAN/WAN6 (eth1): DHCP/DHCPv6
            N1 and HC5962 LAN management address: 192.168.3.1
            HC5962 WAN/WAN6: DHCP/DHCPv6
            N1 single-port upstream gateway and DNS: 192.168.3.254
            Username: root

            x86_64/N1 include daed with kernel BTF/XDP support.
            HC5962 includes PassWall with sing-box as its only proxy core.
            Wi-Fi, Samba/KSMBD, Docker and Podman are excluded from all builds.
